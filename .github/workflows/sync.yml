name: sync with upstream

# Free on public repositories: GitHub Actions bills nothing for public repos,
# and this workflow calls no AI model of any kind. It is plain Python.
#
# Two things worth knowing about the free tier, both handled below:
#   * Actions are DISABLED by default on a fork; enable them once in the
#     Actions tab.
#   * GitHub pauses scheduled workflows after 60 days of repository
#     inactivity. The heartbeat job keeps this one alive.

on:
  schedule:
    - cron: "0 3 * * 1"      # Mondays, 03:00 UTC
  workflow_dispatch:          # and whenever you click "Run workflow"

permissions:
  contents: write             # to push the regenerated tree and its tag
  issues: write               # to report a guard failure

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.synced }}
      tag: ${{ steps.sync.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # tags are how we know where we are

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for a newer upstream release
        id: check
        run: |
          python sync.py --check | tee check.txt
          if grep -q "update available" check.txt; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      # The guard inside rename.py runs here. If upstream has introduced a
      # spelling the transform does not cover, sync.py exits non-zero and
      # NOTHING is committed, pushed or published.
      - name: Regenerate from upstream
        id: sync
        if: steps.check.outputs.needed == 'true'
        run: |
          python sync.py
          echo "synced=true" >> "$GITHUB_OUTPUT"
          # Read the tag sync.py recorded, rather than `git describe`, which
          # would pick whichever tag happens to be reachable.
          echo "tag=$(cat upstream-tag.txt)" >> "$GITHUB_OUTPUT"

      - name: Install and run the test suite
        if: steps.sync.outputs.synced == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" pytest hypothesis
          # Deselect only the divergences that are documented and justified in
          # fork-divergences.txt. Anything else failing means the rename broke
          # something real, and the run stops before pushing.
          DESELECT=$(grep -v '^\s*#' fork-divergences.txt | grep -v '^\s*$' \
                     | sed 's/^/--deselect /' | tr '\n' ' ')
          pytest tests -q $DESELECT

      # Tags are force-pushed because sync.py creates them with `git tag -f`.
      # A plain `--follow-tags` silently refuses to move a tag that already
      # exists on the remote, which would leave the release tag pointing at the
      # wrong tree -- and the publish job below checks that tag out.
      - name: Push
        if: steps.sync.outputs.synced == 'true'
        run: |
          git push origin HEAD:main
          git push --force origin "refs/tags/${{ steps.sync.outputs.tag }}"

      - name: Report a failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sync failed — upstream needs a look`,
              body: [
                'The weekly sync stopped and **nothing was published**.',
                '',
                'The usual cause is that upstream introduced a spelling the',
                'rename does not cover yet, so the guard refused to ship it.',
                'The log lists every offending `file:line`.',
                '',
                `Log: ${run}`,
                '',
                'To fix: add the new spelling to the transform in',
                '`overlay/migrate.py` (or to `PROTECTED_WORDS` if it is an',
                'unrelated word that merely contains the letters), then re-run',
                'this workflow.',
              ].join('\n'),
              labels: ['sync'],
            });

  # Publishes to PyPI with Trusted Publishing: no API token, no stored secret,
  # nothing that can leak or expire. PyPI is told once, on its website, that
  # this repository and this workflow file are allowed to publish the package.
  # That is why the Trusted Publisher form must name `sync.yml`.
  publish:
    runs-on: ubuntu-latest
    needs: sync
    if: needs.sync.outputs.synced == 'true'
    environment: pypi
    permissions:
      id-token: write         # the OIDC token that replaces an API token
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Skipped silently if the version already exists on PyPI, so a re-run
      # never fails on "file already exists".
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Scheduled workflows are disabled after 60 days without repository
  # activity. Upstream may go quiet for longer than that, so touch a file on a
  # schedule to keep the timer from ever expiring.
  heartbeat:
    runs-on: ubuntu-latest
    needs: sync
    if: needs.sync.outputs.synced != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Keep scheduled runs alive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          date -u +"last checked: %Y-%m-%dT%H:%M:%SZ" > .github/last-sync-check
          git add .github/last-sync-check
          git diff --staged --quiet || git commit -m "chore: sync heartbeat"
          git push
